; Private config for sketch_server.py --config. deploy/deploy.sh writes this
; file for you; use this example only when running the server by hand.
; Keep it out of any public folder and readable only by the server
; (deploy.sh sets it to root:vrsketch, mode 640).
; The server re-reads it on every unlock and save, so edits apply right away.

[upload]
; Entered on the VR page to unlock uploads. At least 8 characters.
passcode = change-me

; Folder the save button (X) uploads OBJ files to. Absolute path, writable by the server.
upload_dir = /var/www/maepigeon.com/sketches

; Where that folder is on the web, shown after each upload. Optional.
public_url = https://maepigeon.com/sketches/
